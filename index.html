<style>
/* Basic Regular (Sorkin Type, SIL OFL 1.1), served with the page — the only typeface */
@font-face{font-family:"Basic";src:url("Basic-Regular.ttf") format("truetype");font-weight:400;font-style:normal;font-display:swap}
/* SUBAR SITTA — navy-platinum identity (Blueprint v1.0). English only. One typeface (Basic, single weight): hierarchy from size, caps and spacing. */
:root{
  --midnight:#070E1D;--navy:#0B1930;--raised:#102341;--cobalt:#183967;--rail:#0A1529;
  --plat:#DCE4EC;--white:#F8FAFD;--silver:#8998AE;--muted:#657891;--seam:#38516C;
  --ice:#A9D9F2;--mint:#9CDEC2;--amber:#FFD18C;--coral:#F39C9B;
  --edge:rgba(220,228,236,.13);--edge2:#29405b;--shadow:0 20px 64px rgba(0,0,0,.22);
  --r:22px;--r-sm:14px;--gut:40px;--rail-w:256px;--nav-h:0px;
  --ff:"Basic",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:96px}
body{margin:0;background:var(--midnight);color:var(--plat);font-family:var(--ff);font-weight:400;font-synthesis:none;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit;font-synthesis:none}
button{cursor:pointer;background:none;border:0;padding:0}
b,strong,h1,h2,h3,th{font-weight:400}
h1,h2,h3,p{margin:0}
img{max-width:100%}
:focus-visible{outline:2px solid var(--ice);outline-offset:3px}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- type roles ---------- */
.over{font-size:11px;letter-spacing:.16em;line-height:1.25;color:var(--silver);text-transform:uppercase}
.meta{font-size:12px;letter-spacing:.075em;line-height:1.35;color:var(--silver);text-transform:uppercase}
.disp{font-size:38px;letter-spacing:-.045em;line-height:.96;text-transform:uppercase;color:var(--plat)}
.ice{color:var(--ice)} .mint{color:var(--mint)} .amber{color:var(--amber)} .coral{color:var(--coral)} .sil{color:var(--silver)}
.body{font-size:15px;color:#b6c6d8;max-width:52ch}
/* Basic has proportional digits: fixed-width cells keep numbers aligned */
.n{display:inline-block;min-width:1.25ch;text-align:center}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);max-width:1680px;margin:0 auto;min-height:100vh}
.rail{background:var(--rail);border-right:1px solid #24374e;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:34px 20px 26px}
.brand{display:flex;gap:12px;align-items:center;padding:0 10px 44px;text-align:left}
.brand .mark{width:58px;height:58px;flex:none;object-fit:contain;filter:drop-shadow(0 0 1px rgba(169,217,242,.55)) drop-shadow(0 8px 14px rgba(0,0,0,.45))}
.brand .nm{font-size:24px;line-height:.82;letter-spacing:-.045em;display:block;text-transform:uppercase}
.brand small{display:block;font-size:8px;letter-spacing:.14em;color:var(--silver);margin-top:10px}
.rail .over{padding:0 13px;margin-bottom:18px}
.rail nav{display:grid;gap:6px}
.navi{display:flex;gap:13px;align-items:center;padding:14px 13px;border:1px solid transparent;border-radius:12px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--plat);text-align:left;width:100%}
.navi svg{width:24px;height:24px;flex:none}
.navi .ct{margin-left:auto;color:var(--ice);font-size:10px;letter-spacing:.1em}
.navi:hover{background:#142540}
.navi[aria-current="page"]{background:#152A46;border-color:#35506A;color:var(--white)}
.rail-foot{margin-top:auto;padding:0 12px;font-size:10px;letter-spacing:.1em;color:var(--silver);text-transform:uppercase;display:grid;gap:10px}
.stitch-rule{display:block;height:1px;background:repeating-linear-gradient(90deg,#536a85 0 2px,transparent 2px 9px);opacity:.55;margin-bottom:12px}
main{min-width:0;padding:0 var(--gut) 48px}
.mast{height:88px;display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid #293950}
.mast .sub{display:block;font-size:12px;margin-top:8px;letter-spacing:.06em;text-transform:uppercase}
.mast-r{display:flex;gap:16px;align-items:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--mint);display:inline-block}
.live-dot.off{background:var(--silver)}
.me-btn{width:36px;height:36px;display:grid;place-items:center;border:1px solid #6d85a2;border-radius:50%;color:var(--ice);font-size:13px;overflow:hidden}
.me-btn img{width:100%;height:100%;object-fit:cover}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:6px 9px;border:1px solid var(--seam);color:var(--silver);border-radius:4px;white-space:nowrap}
.tag.sample{color:var(--amber);border-color:#a08353}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--seam);border-radius:12px;color:var(--plat)}
.icon-btn svg{width:22px;height:22px}
.icon-btn[aria-current="page"]{border-color:var(--ice);color:var(--ice)}
.topbar,.dockbar{display:none}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:44px;padding-top:18px;border-top:1px solid #223750;font-size:10px;letter-spacing:.12em;color:var(--silver);text-transform:uppercase}

/* ---------- surfaces ---------- */
.panel{background:#0C1C32;border:1px solid #31455e;border-radius:20px;padding:24px;position:relative;overflow:hidden}
.panel.flush{padding:0}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:18px}
.sec-head .disp{margin-top:9px}
.counter{font-size:10px;letter-spacing:.1em;color:var(--ice);text-transform:uppercase;white-space:nowrap;margin-bottom:3px}
.stack{display:grid;gap:12px}
.stack-lg{display:grid;gap:36px}
.fade{animation:fade .24s ease-out both}@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.divider{height:1px;background:repeating-linear-gradient(90deg,rgba(220,228,236,.12) 0 1px,transparent 1px 2px),linear-gradient(90deg,transparent 0 0);position:relative}
.seam-l{position:relative}
.seam-l::before{content:"";position:absolute;top:0;bottom:0;left:0;width:3px;background:repeating-linear-gradient(180deg,#8ba7c3 0 4px,transparent 4px 12px);opacity:.4;pointer-events:none}

/* ---------- buttons ---------- */
.btn{height:48px;min-width:44px;display:inline-flex;align-items:center;justify-content:space-between;gap:18px;padding:0 20px;border-radius:10px;background:var(--plat);color:#07111D;font-size:13px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.btn .arr{font-size:20px;line-height:1}
.btn:not(:disabled):hover{background:var(--ice)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.line{background:transparent;color:var(--plat);border:1px solid var(--seam)}
.btn.line:not(:disabled):hover{border-color:var(--ice);color:var(--ice);background:transparent}
.btn.block{width:100%}
.link{color:var(--ice);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:10px 0;min-height:44px}

/* ---------- hero (InflatableSixHero) ---------- */
.hero{position:relative;overflow:hidden;background:linear-gradient(115deg,#0B1930 0%,#102849 100%);border:1px solid #32475c;border-radius:25px;margin:30px 0 40px;min-height:310px;padding:38px 42px;display:flex;flex-direction:column;justify-content:space-between;gap:26px;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;inset:0 0 0 52%;opacity:.16;pointer-events:none;background:repeating-radial-gradient(circle at 100% 18%,transparent 0 55px,#7798bc 56px 57px)}
.hero-copy{position:relative;z-index:1;max-width:62%;display:grid;gap:18px}
.hero h1{font-size:clamp(56px,5.6vw,92px);letter-spacing:-.055em;line-height:.9;text-transform:uppercase;color:var(--plat)}
.hero h1 em{font-style:normal;color:var(--ice)}
.hero .six{position:absolute;right:5%;top:50%;transform:translateY(-50%) rotate(-6deg);width:min(30%,300px);z-index:1;filter:drop-shadow(0 22px 26px rgba(3,8,17,.6))}
.join-mark{width:72px;height:72px;object-fit:contain;filter:drop-shadow(0 0 1px rgba(169,217,242,.5))}
.hero .six.txt{font-size:260px;line-height:1;color:#274977;width:auto;text-shadow:0 10px 18px #06101e}
.hero-low{position:relative;z-index:1;display:flex;align-items:end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.tags{display:flex;gap:10px 14px;flex-wrap:wrap;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--plat)}
.tags .sl{color:#8193A9}
.cd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--silver)}
.cd b{font-size:30px;letter-spacing:-.04em;color:var(--white);text-transform:none}
.cd .u{font-size:12px;color:var(--silver);margin:0 6px 0 2px}

/* ---------- home grid ---------- */
.grid{display:grid;grid-template-columns:minmax(0,8fr) minmax(300px,4fr);gap:26px;align-items:start}
.col{display:grid;gap:22px;min-width:0}

/* ---------- FixtureCard + ScoreStepper ---------- */
.fixtures{display:grid;gap:12px}
.fx{background:var(--raised);border:1px solid var(--edge2);border-radius:18px;padding:16px 20px 16px 22px;position:relative;overflow:hidden;transition:border-color .2s}
.fx::before{content:"";position:absolute;top:0;bottom:0;left:0;width:3px;background:repeating-linear-gradient(180deg,#8ba7c3 0 4px,transparent 4px 12px);opacity:.4}
.fx[data-state="edited"]::before,.fx[data-state="saving"]::before{background:var(--ice);opacity:1;width:2px}
.fx[data-state="failed"]::before,.fx[data-state="error"]::before{background:var(--coral);opacity:1;width:2px}
.fx-head{display:flex;justify-content:space-between;gap:10px;font-size:10px;letter-spacing:.13em;color:var(--silver);text-transform:uppercase;margin-bottom:14px}
.fx-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;row-gap:16px;align-items:center}
.fx-body .stepper{grid-column:1/-1;grid-row:2;justify-content:center}
.tm{display:flex;align-items:center;gap:12px;min-width:0}
.tm.away{flex-direction:row-reverse;text-align:right}
.tm .nm{font-size:20px;line-height:1.12;letter-spacing:-.015em;text-transform:uppercase;overflow-wrap:normal;word-break:normal;hyphens:none}
.tm .code{display:block;text-transform:uppercase;color:var(--silver);font-size:10px;letter-spacing:.1em;margin-top:6px}
.crest{width:var(--cs,44px);height:var(--cs,44px);flex:none;display:grid;place-items:center}
.crest img{max-width:100%;max-height:100%;object-fit:contain}
.crest.backed{background:var(--plat);border-radius:50%;padding:3px}
.stepper{display:flex;align-items:center;gap:10px}
.colon{color:var(--silver);font-size:20px}
.step{display:grid;grid-template-columns:44px 58px 44px;align-items:center;gap:4px}
.step button{height:52px;border-radius:10px;background:#1c3854;border:1px solid var(--seam);color:var(--plat);font-size:20px;line-height:1;display:grid;place-items:center}
.step button:hover:not(:disabled){border-color:var(--ice);color:var(--ice)}
.step button:disabled{opacity:.35;cursor:not-allowed}
.si{width:58px;height:52px;text-align:center;background:var(--midnight);color:var(--white);border:1px solid #58728e;border-radius:10px;font-size:28px;letter-spacing:-.04em;padding:0;caret-color:var(--ice)}
.si::placeholder{color:#4a5f78}
.si.dirty{border-color:var(--ice);box-shadow:inset 0 0 0 1px var(--ice)}
.si[aria-invalid="true"]{border-color:var(--coral);box-shadow:inset 0 0 0 1px var(--coral)}
.si:disabled{opacity:1;border-style:dashed;border-color:var(--seam);color:var(--plat)}
.fx-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;font-size:10px;letter-spacing:.1em;color:var(--silver);text-transform:uppercase}
.st{display:inline-flex;align-items:center;gap:7px}
.st i{width:7px;height:7px;border-radius:50%;border:1px solid currentColor;flex:none}
.st.saved{color:var(--mint)} .st.saved i{background:var(--mint)}
.st.edited,.st.saving{color:var(--ice)} .st.edited i{background:var(--ice)}
.st.half{color:var(--amber)}
.st.failed,.st.error{color:var(--coral)} .st.failed i,.st.error i{background:var(--coral)}
.st.locked{color:var(--silver)}
.res{display:inline-flex;gap:10px;align-items:center;color:var(--plat)}
.pts{display:inline-grid;place-items:center;min-width:34px;height:22px;padding:0 7px;border-radius:5px;font-size:11px;letter-spacing:.04em;border:1px solid var(--seam);color:var(--silver)}
.pts.p5{background:var(--mint);border-color:var(--mint);color:#06231a}
.pts.p2{border-color:var(--ice);color:var(--ice)}

/* ---------- Golden Goal (StitchDial) ---------- */
.gg{background:var(--navy);border:1px solid #31455e;border-radius:20px;padding:22px 24px 24px;position:relative;overflow:hidden}
.gg::before{content:"";position:absolute;left:24px;right:24px;top:0;height:2px;background:repeating-linear-gradient(90deg,#8ba7c3 0 4px,transparent 4px 11px);opacity:.35}
.gg-top{display:flex;justify-content:space-between;align-items:start;gap:16px;flex-wrap:wrap}
.gg .help{font-size:13px;color:var(--silver);max-width:44ch;margin-top:10px}
.dial{display:flex;align-items:center;gap:14px}
.dial button{width:46px;height:46px;border-radius:50%;border:1px solid var(--seam);background:#1c3854;font-size:20px;display:grid;place-items:center}
.dial button:hover{border-color:var(--ice);color:var(--ice)}
.minute{min-width:120px;text-align:center;font-size:48px;letter-spacing:-.05em;line-height:1;color:var(--white)}
.minute sup{font-size:.45em;color:var(--ice);margin-left:2px}
.minute.unset{font-size:13px;letter-spacing:.12em;color:var(--amber);text-transform:uppercase}
.range{margin-top:20px}
.range input{width:100%;height:44px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;--p:0%}
.range input::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--ice) var(--p),var(--cobalt) var(--p))}
.range input::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--ice) var(--p),var(--cobalt) var(--p))}
.range input::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-10px;border-radius:50%;background:var(--plat);border:4px solid var(--midnight);box-shadow:0 0 0 1px var(--ice)}
.range input::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--plat);border:4px solid var(--midnight)}
.range.unset input::-webkit-slider-thumb{background:var(--silver);box-shadow:0 0 0 1px var(--seam)}
.ticks{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.06em;color:var(--silver);padding:0 4px}
.ticks span{position:relative;padding-top:8px}
.ticks span::before{content:"";position:absolute;top:0;left:50%;width:1px;height:5px;background:var(--seam)}

/* ---------- save bar (SavePredictions) ---------- */
#dock{position:sticky;bottom:calc(var(--nav-h) + 12px);z-index:15}
.savebar{margin-top:4px;background:rgba(16,35,65,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid #35506A;border-radius:16px;padding:12px 12px 12px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;box-shadow:var(--shadow)}
.savebar .msg{display:grid;gap:3px;min-width:0}
.savebar .msg b{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--white)}
.savebar .msg span{font-size:12px;color:var(--silver)}
.savebar.saved .msg b{color:var(--mint)} .savebar.failed .msg b{color:var(--coral)} .savebar.partial .msg b{color:var(--amber)}
.savebar .btn{flex:none}

/* ---------- side panels ---------- */
.side{background:#0C1C32;border:1px solid #31455e;border-radius:20px;padding:24px;position:relative;overflow:hidden}
.side.field-map::before{content:"";position:absolute;right:-90px;top:-140px;width:380px;height:380px;background:repeating-radial-gradient(circle,transparent 0 55px,#496b92 56px 57px);opacity:.16;pointer-events:none}
.side .sec-head{position:relative}
.side .disp{font-size:32px}
.mini-fx{display:grid;gap:0}
.mini-row .t{display:flex;align-items:center;gap:8px;min-width:0}.mini-row .t.a{flex-direction:row-reverse}
.mini-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #1f3550;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.mini-row:last-child{border-bottom:0}
.mini-row .a{text-align:right}
.mini-row .sc{font-size:20px;letter-spacing:-.03em;color:var(--white);min-width:56px;text-align:center}
.mini-row .mine{font-size:10px;color:var(--silver);display:block;margin-top:3px;text-align:center;letter-spacing:.08em}
.thead,.lrow{display:grid;grid-template-columns:34px 28px minmax(0,1fr) 44px 52px;gap:10px;align-items:center}
.thead{font-size:10px;letter-spacing:.12em;color:var(--silver);text-transform:uppercase;padding:0 0 12px;border-bottom:1px solid #2e4966}
.thead .r,.lrow .r{text-align:right}
.lrow{padding:13px 0;border-bottom:1px solid #253a53;width:100%;text-align:left;font-size:13px;letter-spacing:.04em}
.lrow:hover .who .nm{color:var(--ice)}
.lrow .pos{color:var(--silver);font-size:12px}
.lrow .who{display:flex;align-items:center;gap:10px;min-width:0}
.lrow .who .nm{text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .who small{display:block;font-size:10px;letter-spacing:.08em;color:var(--silver);margin-top:3px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .rd{color:var(--silver);font-size:13px}
.lrow .tot{font-size:25px;letter-spacing:-.04em;color:var(--white)}
.lrow.me{background:linear-gradient(90deg,rgba(169,217,242,.08),transparent 70%)}
.lrow.me .pos{color:var(--ice)}
.you{display:inline-block;text-transform:uppercase;margin-left:8px;font-size:9px;letter-spacing:.12em;color:var(--ice);border:1px solid rgba(169,217,242,.4);padding:2px 5px;border-radius:3px;vertical-align:2px}
.mv{font-size:11px;display:inline-flex;align-items:center;gap:2px;color:var(--silver)}
.mv.up{color:var(--mint)} .mv.down{color:var(--coral)}
.avatar{width:30px;height:30px;border-radius:50%;flex:none;object-fit:cover;border:1px solid #466381}
.avatar.ini{display:grid;place-items:center;background:#162f4c;font-size:10px;letter-spacing:.04em;color:var(--plat)}
.avatar.lg{width:64px;height:64px;font-size:20px}
.footnote{font-size:11px;color:var(--silver);margin-top:14px}
details.side summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.12em;text-transform:uppercase;min-height:24px}
details.side summary::-webkit-details-marker{display:none}
details.side summary::after{content:"+";font-size:20px;color:var(--ice)}
details.side[open] summary::after{content:"−"}
.rules{margin:16px 0 0;padding:0;list-style:none;display:grid;gap:12px;counter-reset:r}
.rules li{counter-increment:r;display:grid;grid-template-columns:28px 1fr;font-size:14px;color:#b6c6d8}
.rules li::before{content:counter(r,decimal-leading-zero);font-size:11px;color:var(--ice);letter-spacing:.1em;padding-top:3px}

/* ---------- page headers ---------- */
.page-head{padding:30px 0 6px;display:grid;gap:10px}
.page-head .disp{font-size:54px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--seam);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--silver)}
.seg button[aria-pressed="true"]{border-color:var(--ice);color:var(--midnight);background:var(--ice)}

/* ---------- results ---------- */
.rrow{display:grid;grid-template-columns:minmax(0,1fr) 110px minmax(0,1fr);gap:12px;align-items:center;padding:16px 22px;border-bottom:1px solid #1f3550}
.rrow:last-child{border-bottom:0}
.rrow .t{font-size:15px;text-transform:uppercase;letter-spacing:-.01em;display:flex;gap:10px;align-items:center;min-width:0}
.rrow .t.a{flex-direction:row-reverse;text-align:right}
.rrow .c{text-align:center;display:grid;gap:5px;justify-items:center}
.rrow .c .sc{font-size:26px;letter-spacing:-.04em;color:var(--white)}
.rrow .c small{font-size:10px;letter-spacing:.1em;color:var(--silver);text-transform:uppercase}
.tablewrap{overflow-x:auto;border:1px solid #31455e;border-radius:18px;background:#0C1C32}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:12px 10px;text-align:center;border-bottom:1px solid #1f3550;white-space:nowrap}
th{font-size:10px;letter-spacing:.1em;color:var(--silver);text-transform:uppercase}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:#0C1C32;z-index:1}
tr:last-child td{border-bottom:0}
.pick{display:inline-block;min-width:40px;padding:3px 6px;border-radius:5px;border:1px solid transparent;color:var(--plat)}
.pick.p5{background:var(--mint);color:#06231a}
.pick.p2{border-color:var(--ice);color:var(--ice)}
.pick.p0{color:var(--silver)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;letter-spacing:.06em;color:var(--silver);text-transform:uppercase;margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* ---------- member ---------- */
.member-top{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{background:var(--raised);border:1px solid var(--edge2);border-radius:16px;padding:18px;display:grid;gap:10px;position:relative;overflow:hidden}
.tile b{font-size:42px;letter-spacing:-.05em;line-height:1;color:var(--white)}
.tile span{font-size:10px;letter-spacing:.12em;color:var(--silver);text-transform:uppercase}
.tile.hl{background:linear-gradient(135deg,#183967,#102341)}
.tile.hl b{color:var(--ice)}
.bars{display:flex;align-items:end;gap:10px;height:150px;padding-top:10px}
.bars .bc{flex:1;display:grid;gap:6px;justify-items:center;height:100%;grid-template-rows:1fr auto}
.bars .b{display:flex;gap:3px;align-items:end;height:100%;width:100%;justify-content:center}
.bars i{display:block;width:12px;background:var(--ice);border-radius:3px 3px 0 0;min-height:2px}
.bars i.o{background:var(--seam)}
.bars small{font-size:10px;letter-spacing:.08em;color:var(--silver)}
select,.inp{height:48px;border-radius:10px;border:1px solid var(--seam);background:var(--midnight);color:var(--plat);padding:0 14px;font-size:14px;letter-spacing:.02em;width:100%}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ice) 50%),linear-gradient(135deg,var(--ice) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.field{display:grid;gap:8px;min-width:0}
.field label{font-size:10px;letter-spacing:.14em;color:var(--silver);text-transform:uppercase}
.err{font-size:12px;color:var(--coral)}

/* ---------- admin ---------- */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
.resline{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #1f3550;font-size:13px;text-transform:uppercase}
.resline .a{text-align:right}
.resline .in{display:flex;gap:8px;align-items:center}
.resline .in input{width:52px;height:48px;text-align:center;font-size:20px;border-radius:10px;border:1px solid var(--seam);background:var(--midnight);color:var(--white)}
.crestgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.crestcell{display:grid;grid-template-columns:40px 1fr;gap:6px 10px;align-items:center;padding:12px;border:1px solid #253a53;border-radius:12px;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.crestcell .ph{width:36px;height:36px;border:1px dashed var(--seam);border-radius:50%;display:grid;place-items:center;font-size:9px;color:var(--silver)}
.crestcell .acts{grid-column:1/-1;display:flex;gap:12px}
.crestcell label,.crestcell .rm{font-size:10px;letter-spacing:.1em;color:var(--ice);cursor:pointer;min-height:32px;display:inline-flex;align-items:center}
.crestcell .rm{color:var(--coral)}

/* ---------- misc ---------- */
.empty{display:grid;gap:12px;justify-items:start;padding:30px}
.empty .ic{width:40px;height:40px;color:var(--ice)}
.empty .ic svg{width:40px;height:40px}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,#102341,#183967,#102341);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 24px);transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--plat);color:#07111D;padding:12px 18px;border-radius:10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;z-index:60;transition:.2s;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--coral)}
.narrow{max-width:760px}

/* ---------- 1024–1279 ---------- */
@media (max-width:1279px){:root{--rail-w:208px;--gut:24px}.fx-body{grid-template-columns:minmax(0,1fr) minmax(0,1fr);row-gap:14px}.fx-body .stepper{grid-column:1/-1;grid-row:2;justify-content:center}.grid{grid-template-columns:minmax(0,7fr) minmax(280px,5fr)}.hero h1{font-size:64px}}
/* ---------- ≤1023: top bar + bottom dock ---------- */
@media (max-width:1023px){
  :root{--nav-h:calc(72px + env(safe-area-inset-bottom))}
  .app{display:block}.rail,.mast{display:none}
  main{max-width:760px;margin:0 auto;padding:0 var(--gut) calc(var(--nav-h) + 24px)}
  .topbar{display:flex;position:sticky;top:0;z-index:30;height:64px;align-items:center;justify-content:space-between;gap:12px;padding:0 var(--gut);background:rgba(7,14,29,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid #1d2f47}
  .topbar .brand{padding:0;gap:9px}
  .topbar .brand .mark{width:40px;height:40px}
  .topbar .brand .nm{font-size:15px}
  .topbar .brand small{display:none}
  .topbar .r{display:flex;gap:10px;align-items:center}
  .dockbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;height:var(--nav-h);padding-bottom:env(safe-area-inset-bottom);background:rgba(10,21,41,.97);border-top:1px solid #354960}
  .dockbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--silver)}
  .dockbar svg{width:22px;height:22px}
  .dockbar button[aria-current="page"]{color:var(--ice)}
  .grid{grid-template-columns:minmax(0,1fr)}
  .hero{margin-top:20px}
}
/* ---------- ≤767 ---------- */
@media (max-width:767px){
  :root{--gut:16px}

const fTime=iso=>new Date(iso).toLocaleTimeString("en-GB",{...KW,hour:"2-digit",minute:"2-digit"});

const pad=n=>String(n).padStart(2,"0");
const ptsFor=(p,r)=>!Array.isArray(p)||!Array.isArray(r)?0:(p[0]===r[0]&&p[1]===r[1]?5:(sgn(p[0],p[1])===sgn(r[0],r[1])?2:0));
function durText(ms){const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);
  return (d?`<b>${d}</b><span class="u">D</span>`:"")+`<b>${h}</b><span class="u">H</span><b>${m}</b><span class="u">M</span>`}
let toastT;function toast(m,bad){const el=$("#toast");el.textContent=m;el.classList.toggle("bad",!!bad);el.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("on"),2600)}
/* TeamMark: an uploaded crest if there is one; otherwise the club code carries the identity (no placeholder art) */
function crest(c,size){const src=BUNDLED.has(c)?`crests/${c}.webp`:"";if(!src)return"";
  return `<span class="crest" ${size?`style="--cs:${size}px"`:""}><img alt="" data-crest="${esc(c)}" src="${src}"></span>`}
function optical(img){try{const c=document.createElement("canvas");c.width=c.height=24;const x=c.getContext("2d");x.drawImage(img,0,0,24,24);const d=x.getImageData(0,0,24,24).data;let L=0,n=0;
  for(let i=0;i<d.length;i+=4){if(d[i+3]>40){L+=.2126*d[i]+.7152*d[i+1]+.0722*d[i+2];n++}}if(n&&L/n<70)img.parentElement.classList.add("backed")}catch(e){}}
document.addEventListener("load",e=>{if(e.target.matches?.("img[data-crest]"))optical(e.target)},true);
document.addEventListener("error",e=>{if(e.target.matches?.("img[data-crest]"))e.target.parentElement?.remove()},true);
function roundList(){return Object.entries(S.rounds).map(([id,r])=>({id,...r})).sort((a,b)=>a.n-b.n)}
function current(){const id=S.meta?.currentRound;return id&&S.rounds[id]?{id,...S.rounds[id]}:roundList().at(-1)||null}
const isLocked=r=>!!r&&(!!r.locked||Date.now()>=new Date(r.deadline).getTime());
const isSettled=r=>!!r&&r.fixtures?.length===6&&r.fixtures.every(f=>Array.isArray(f.res)||f.void);
const pickOf=(uid,rid)=>S.picks[uid]?.rounds?.[rid]||null;
const dname=uid=>S.players[uid]?.nick||S.profiles[uid]?.name||"Member";
const initials=uid=>dname(uid).split(/\s+/).filter(Boolean).slice(0,2).map(w=>[...w][0]).join("").toUpperCase();
function av(uid,cls=""){const u=S.profiles[uid]?.avatarUrl;return u?`<img class="avatar ${cls}" alt="" src="${esc(u)}">`:`<span class="avatar ini ${cls}" aria-hidden="true">${esc(initials(uid))}</span>`}

function roundScores(r){
  const fg=r.firstGoal??null;
  return Object.keys(S.players).map(uid=>{const p=pickOf(uid,r.id);let pts=0,ex=0,rs=0;
    (r.fixtures||[]).forEach(f=>{const v=ptsFor(p?.s?.[f.id],f.res);pts+=v;if(v===5)ex++;else if(v===2)rs++});
    return {uid,pts,ex,rs,gg:p?.gg??null,ggd:p&&p.gg!=null&&fg!=null?Math.abs(p.gg-fg):Infinity,played:!!p}})
   .sort((a,b)=>b.pts-a.pts||a.ggd-b.ggd);
}
function standings(upto){
  const T0={};Object.keys(S.players).forEach(u=>T0[u]={uid:u,pts:0,ex:0,rs:0,won:0,played:0,hist:[]});
  roundList().filter(isSettled).slice(0,upto??undefined).forEach(r=>{const sc=roundScores(r),top=sc[0];
    sc.forEach(x=>{const s=T0[x.uid];if(!s)return;s.pts+=x.pts;s.ex+=x.ex;s.rs+=x.rs;if(x.played)s.played++;
      if(top&&x.played&&top.pts>0&&x.pts===top.pts&&x.ggd===top.ggd)s.won++;s.hist.push({n:r.n,pts:x.pts})})});
  return Object.values(T0).sort((a,b)=>b.pts-a.pts||b.ex-a.ex||b.won-a.won);
}
function table(){const n=roundList().filter(isSettled).length;const now=standings();
  const prev=n>1?standings(n-1):null;const pr={};prev?.forEach((s,i)=>pr[s.uid]=i);
  return now.map((s,i)=>({...s,rank:i+1,last:s.hist.at(-1)?.pts??null,move:prev&&pr[s.uid]!=null?pr[s.uid]-i:null}))}

const errMsg=e=>{const m=String(e?.message||e||"");return /row-level security|violates/i.test(m)?t.locked:/invite code/i.test(m)?t.badCode:/Invalid login/i.test(m)?t.authErr:m||t.err.gen};
async function q(p){try{const {data,error}=await p;if(error){toast(errMsg(error),true);return null}return data??true}catch(e){toast(t.err.gen,true);return null}}
/* everything a member can see, in one go (the data is small); RLS decides what comes back */
async function loadAll(){
  const [lg,rd,pl,pk]=await Promise.all([sb.from("league").select("*").maybeSingle(),sb.from("rounds").select("*").order("n"),sb.from("players").select("*"),sb.from("picks").select("*")]);
  if(lg.error||rd.error||pl.error||pk.error){S.loadFailed=true;S.ready=true;render();return}
  const L=lg.data;S.meta=L?{season:L.season,currentRound:L.current_round,auto:L.auto,status:L.status,statusAt:L.status_at,calls:L.calls_day===new Date().toISOString().slice(0,10)?L.calls_today:0}:null;
  S.rounds={};(rd.data||[]).forEach(r=>{(r.fixtures||[]).forEach(f=>{if(f.h&&!CLUBS[f.h])CLUBS[f.h]=f.hn||f.h;if(f.a&&!CLUBS[f.a])CLUBS[f.a]=f.an||f.a});
    S.rounds[r.id]={n:r.n,deadline:r.deadline,locked:r.locked,firstGoal:r.first_goal,fixtures:r.fixtures||[],settledAt:r.settled_at}});
  S.players={};(pl.data||[]).forEach(p=>S.players[p.id]={nick:p.nick,isAdmin:p.is_admin});
  S.picks={};(pk.data||[]).forEach(p=>{(S.picks[p.user_id]??={rounds:{}}).rounds[p.round_id]={s:p.s||{},gg:p.gg,at:p.at}});
  S.isAdmin=!!S.players[S.uid]?.isAdmin;
  const cr=current();S.counts={};if(cr&&!isLocked(cr)&&S.players[S.uid]){const {data}=await sb.rpc("pick_count",{r:cr.id});S.counts[cr.id]=data??0}
  if(S.isAdmin&&S.page==="admin"&&S.invite==null){const {data}=await sb.rpc("invite_code");S.invite=data}
  S.got={meta:1,rounds:1,players:1,picks:1,profiles:1};S.loadFailed=false;S.ready=true;render()}
const reload=()=>{clearTimeout(reloadT);reloadT=setTimeout(loadAll,250)};
function live(){sb.channel("subar").on("postgres_changes",{event:"*",schema:"public"},reload).subscribe()}
/* writes go to the table they belong to; the database enforces who may write what, and when */
async function write(path,data,merge){
  if(S.demo){await new Promise(r=>setTimeout(r,500));demoWrite(path,data,merge);return true}
  const [c,id]=path.split("/");let ok;
  if(c==="picks"){const r=data.rounds[S.draftRound];ok=await q(sb.from("picks").upsert({user_id:S.uid,round_id:S.draftRound,s:r.s,gg:r.gg}))}
  else if(c==="rounds"){const m={};for(const [k,v] of Object.entries(data))m[{firstGoal:"first_goal"}[k]||k]=v;
    if(m.fixtures&&m.fixtures.every(f=>Array.isArray(f.res)||f.void))m.settled_at=new Date().toISOString();
    ok=await q(merge?sb.from("rounds").update(m).eq("id",id):sb.from("rounds").insert({id,...m}))}
  else if(c==="meta"&&id==="league"){ok=await q(sb.from("league").update({current_round:data.currentRound}).eq("id",1))}
  if(ok)reload();return !!ok}
function demoWrite(path,data,merge){const [c,id]=path.split("/");const tgt={meta:null,rounds:S.rounds,players:S.players,picks:S.picks}[c];
  if(c==="meta"){S.meta={...(merge?S.meta:{}),...data};return}
  tgt[id]=merge?{...tgt[id],...data}:data}

/* ===================== countdown ===================== */
function tick(){document.querySelectorAll("[data-deadline]").forEach(el=>{const ms=new Date(el.dataset.deadline)-Date.now();if(ms<=0){sb?reload():render();return}
  const d=el.querySelector("[data-dur]");if(d)d.innerHTML=durText(ms)})}
setInterval(()=>{if(document.querySelector("[data-deadline]"))tick()},15000);
const kwIso=v=>v?new Date(v+":00+03:00").toISOString():null;

/* ===================== interactions ===================== */
function setScore(fid,i,val){const r=current();if(!r||isLocked(r))return;const cur=S.draft.s[fid]?[...S.draft.s[fid]]:[null,null];
  cur[i]=val;if(cur[0]==null&&cur[1]==null)delete S.draft.s[fid];else S.draft.s[fid]=cur;S.dirty=true;if(S.saveState!=="saving"&&S.saveState!=="failed")S.saveState="dirty"}
async function save(){const r=current();if(!r||isLocked(r)){toast(t.st.locked,true);render();return}
  if(!S.demo&&!S.got.picks){S.saveState="failed";toast(t.err.gen,true);render();return}  /* never write before the saved picks have loaded: other rounds would be lost */
  const clean=Object.fromEntries(Object.entries(S.draft.s).filter(([,v])=>v[0]!=null&&v[1]!=null).map(([k,v])=>[k,[v[0],v[1]]]));
  const rounds={...(S.picks[S.uid]?.rounds||{}),[r.id]:{s:clean,gg:S.draft.gg,at:new Date().toISOString()}};
  S.saveState="saving";Object.keys(clean).forEach(syncCard);dock();
  const ok=await write("picks/"+S.uid,{rounds});
  if(ok){S.picks[S.uid]={rounds};S.dirty=false;S.saveState="saved";toast(t.ds.saved[0])}else S.saveState="failed";
  render();
}
document.addEventListener("click",async e=>{
  const go=e.target.closest("[data-go]");if(go){S.page=go.dataset.go;if(S.page==="admin"&&sb&&S.isAdmin&&S.invite==null)sb.rpc("invite_code").then(({data})=>{S.invite=data;if(S.page==="admin")render()});if(go.hasAttribute("data-self"))S.viewPlayer=S.uid;if(go.dataset.round)S.viewRound=go.dataset.round;
    try{history.replaceState(null,"","#"+S.page)}catch(_){}render();scrollTo({top:0});return}
  const pl=e.target.closest("[data-player]");if(pl){S.viewPlayer=pl.dataset.player;S.page="player";render();scrollTo({top:0});return}
  const tb=e.target.closest("[data-tab]");if(tb){S.authTab=tb.dataset.tab;render();return}
  const rb=e.target.closest("[data-round]");if(rb){S.viewRound=rb.dataset.round;render();return}
  const stp=e.target.closest("[data-step]");if(stp&&!stp.disabled){const f=stp.dataset.f,i=+stp.dataset.i;const cur=S.draft.s[f]?.[i];
    delete S.bad[f+":"+i];setScore(f,i,Math.max(0,Math.min(20,(cur??0)+(cur==null&&+stp.dataset.step<0?0:+stp.dataset.step))));syncCard(f);return}
  const gg=e.target.closest("[data-gg]");if(gg){setGG(S.draft.gg==null?45:S.draft.gg+ +gg.dataset.gg);return}
  const act=e.target.closest("[data-act]");if(!act)return;const a=act.dataset.act;
  if(a==="jump"){const r=current();const f=r.fixtures.find(f=>{const v=S.draft.s[f.id];return !v||v[0]==null||v[1]==null});
    const el=f?document.querySelector(`[data-in="${f.id}"][data-i="${S.draft.s[f.id]?.[0]==null?0:1}"]`):$("#ggt");
    el?.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});if(f)el?.focus({preventScroll:true});return}
  if(a==="save"){save();return}
  const authErr=m=>{const el=$("#autherr");if(el){el.textContent=m;el.hidden=false}};
  if(a==="join"||a==="signup"){const code=($("#code").value||"").trim(),nick=($("#nick").value||"").trim().slice(0,24);
    if(code.length<4)return authErr(t.badCode);if(nick.length<2)return authErr(t.nickErr);
    act.disabled=true;
    if(a==="signup"){const email=($("#em").value||"").trim(),pw=$("#pw").value||"";
      if(!/^\S+@\S+\.\S+$/.test(email)){act.disabled=false;return authErr(t.badEmail)}if(pw.length<8){act.disabled=false;return authErr(t.weakPw)}
      S.pendingJoin={code,nick};const {data,error}=await sb.auth.signUp({email,password:pw});
      if(error){act.disabled=false;return authErr(errMsg(error))}
      if(!data.session){act.disabled=false;return authErr(t.confirmEmail)}S.uid=data.session.user.id}
    const {error}=await sb.rpc("join_league",{code,nick});S.pendingJoin=null;
    if(error){act.disabled=false;return authErr(errMsg(error))}toast(t.joined);await loadAll();return}
  if(a==="signin"){const email=($("#em").value||"").trim(),pw=$("#pw").value||"";act.disabled=true;
    const {error}=await sb.auth.signInWithPassword({email,password:pw});if(error){act.disabled=false;authErr(errMsg(error))}return}
  if(a==="forgot"){const email=($("#em").value||"").trim();if(!/^\S+@\S+\.\S+$/.test(email))return authErr(t.badEmail);
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin});authErr(error?errMsg(error):t.resetSent);return}
  if(a==="setpw"){const pw=$("#npw").value||"";if(pw.length<8)return toast(t.weakPw,true);if(await q(sb.auth.updateUser({password:pw}))){S.recovery=false;toast(t.pwSaved);loadAll()}return}
  if(a==="signout"){S.authTab="in";S.page="home";await sb.auth.signOut();return}
  if(a==="retryload"){S.ready=false;render();loadAll();return}
  if(a==="auto"){if(await q(sb.from("league").update({auto:act.dataset.v==="1"}).eq("id",1)))reload();return}
  if(a==="runauto"){act.disabled=true;const r=await q(sb.rpc("run_autopilot"));act.disabled=false;if(r)toast(String(r));reload();return}
  if(a==="newcode"){const c=await q(sb.rpc("new_invite_code"));if(c){S.invite=c;render()}return}
  if(a==="copycode"){try{await navigator.clipboard.writeText(S.invite||"");toast(t.copied)}catch(_){}return}
  if(a==="lock"){const r=S.rounds[act.dataset.r];if(await write("rounds/"+act.dataset.r,{locked:!r.locked},true)){toast(r.locked?t.reopenedMsg:t.lockedMsg);render()}return}
  if(a==="results"){const id=act.dataset.r,r=S.rounds[id];const num=v=>{v=v.trim();return v!==""&&/^\d{1,2}$/.test(v)?+v:null};
    const fixtures=r.fixtures.map(f=>{const h=num($("#rh-"+f.id).value),aw=num($("#ra-"+f.id).value);return{...f,res:h!=null&&aw!=null?[h,aw]:null}});
    const fg=num($("#fg").value);if(await write("rounds/"+id,{fixtures,firstGoal:fg==null?null:Math.max(1,Math.min(90,fg))},true)){toast(t.resultsSaved);render()}return}
  if(a==="newround"){const n=+act.dataset.n,fixtures=[];
    for(let i=0;i<6;i++){const h=$("#nh"+i).value,aw=$("#na"+i).value,ko=kwIso($("#nk"+i).value);if(!h||!aw||!ko||h===aw){toast(t.needSix,true);return}fixtures.push({id:"f"+(i+1),h,a:aw,ko,res:null})}
    if(new Set(fixtures.flatMap(f=>[f.h,f.a])).size!==12){toast(t.dup,true);return}
    const deadline=kwIso($("#ndl").value)||fixtures.map(f=>f.ko).sort()[0],id="r"+n;act.disabled=true;
    if(await write("rounds/"+id,{n,deadline,fixtures,firstGoal:null,locked:false})&&await write("meta/league",{season:S.meta?.season||"2026/27",currentRound:id})){toast(t.opened(n));S.page="home";render()}else act.disabled=false;return}
});
/* typed scores: whole numbers 0–20; blank stays blank (never 0–0) */
document.addEventListener("input",e=>{const el=e.target;

document.addEventListener("focusout",e=>{const el=e.target;if(!el.dataset?.in)return;const k=el.dataset.in+":"+el.dataset.i;if(S.bad[k]){delete S.bad[k];el.value="";syncCard(el.dataset.in)}});
document.addEventListener("keydown",e=>{const el=e.target;if(!el.dataset?.in)return;const f=el.dataset.in,i=+el.dataset.i;
  if(e.key==="ArrowUp"||e.key==="ArrowDown"){e.preventDefault();const cur=S.draft.s[f]?.[i];delete S.bad[f+":"+i];
    setScore(f,i,Math.max(0,Math.min(20,cur==null?0:cur+(e.key==="ArrowUp"?1:-1))));syncCard(f)}
  else if(e.key==="Enter"){e.preventDefault();const all=[...document.querySelectorAll("[data-in]")];all[all.indexOf(el)+1]?.focus()}});
document.addEventListener("change",async e=>{const el=e.target;
  if(el.id==="selp"){S.viewPlayer=el.value;render()}
  if(el.id==="selv"){S.vsPlayer=el.value;render()}
  if(el.id==="setcur"){if(await write("meta/league",{season:S.meta?.season||"2026/27",currentRound:el.value}))toast(t.curChanged)}
});
addEventListener("beforeunload",e=>{if(S.dirty&&S.page==="home")e.preventDefault()});

/* ===================== boot ===================== */
(()=>{const h=location.hash.slice(1);if(h==="predict")S.page="home";else if([...PAGES,"admin"].includes(h))S.page=h})();
render();
(async()=>{
  if(!window.supabase||!cfg.url||/YOUR/.test(cfg.url)){loadSample();render();return}   /* no backend configured: sample data */
  sb=supabase.createClient(cfg.url,cfg.key);
  sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==="PASSWORD_RECOVERY"){S.recovery=true;S.uid=session?.user?.id||null;S.ready=true;render();return}
    const uid=session?.user?.id||null;if(uid===S.uid&&ev!=="SIGNED_IN"&&S.ready)return;
    S.uid=uid;S.invite=null;S.draft=null;S.draftRound=null;S.dirty=false;
    if(!uid){S.ready=true;S.players={};S.picks={};S.rounds={};S.meta=null;render();return}
    if(S.pendingJoin)return;                       /* sign-up in progress: join first, then load */
    setTimeout(loadAll,0)});
  live();
  addEventListener("focus",()=>{if(S.uid)reload()});
})();
</script>
</body>
</html>
