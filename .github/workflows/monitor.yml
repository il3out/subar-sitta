# Every 15 minutes: is subarsitta.com up, is the database answering, is the autopilot keeping up?
# Read-only and signed out. A failure opens (or updates) one "outage" issue; recovery closes it.
name: Monitor
on:
  schedule: [{ cron: "*/15 * * * *" }]
  workflow_dispatch:
  push:   # also run when this check itself changes, so edits are proven before they merge
    paths: [".github/workflows/monitor.yml", "tests/monitor.js"]
permissions:
  issues: write
concurrency: { group: monitor, cancel-in-progress: false }
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          set +e
          node tests/monitor.js | tee monitor.json
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          echo "METRICS $(node -e 'const o=require("./monitor.json");console.log(JSON.stringify({at:o.at,ms:o.ms,fail:o.fail,warn:o.warn,latest:o.latest}))')"
      - name: Open or update the outage issue
        if: steps.check.outputs.code != '0'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh label create outage --color B60205 --description "Live site or database down" 2>/dev/null || true
          body="$(printf 'Monitor failed at %s\n\n```json\n%s\n```\nRun: %s' "$(date -u +%FT%TZ)" "$(cat monitor.json)" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          n=$(gh issue list --label outage --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --label outage --title "Outage: subarsitta.com health check failing" --body "$body"; fi
          exit 1
      - name: Close the outage issue on recovery
        if: steps.check.outputs.code == '0'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          for n in $(gh issue list --label outage --state open --json number -q '.[].number'); do gh issue close "$n" --comment "Recovered at $(date -u +%FT%TZ)."; done
